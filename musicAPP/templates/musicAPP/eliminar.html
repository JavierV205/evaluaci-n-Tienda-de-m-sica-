<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Instrumento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow border-0">
            <div class="card-header bg-danger text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="fa-solid fa-triangle-exclamation me-2"></i>Confirmar Eliminacion</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">¿Estas seguro de que deseas eliminar el instrumento? <strong>"{{ instrumento.nombre }}"</strong>?</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'inicio' %}" class="btn btn-secondary"><i class="fa-solid fa-xmark me-1"></i> Cancelar</a>
                        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash me-1"></i> Si, Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
